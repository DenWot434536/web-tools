<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск и замена — ToolBox</title>
<meta name="description" content="Замена слов и фрагментов текста.">
<link rel="stylesheet" href="../style.css">
<script src="../script.js" defer></script>
</head>
<body>

<header class="header">
<div class="container header-content">
<a href="../index.html" class="logo">🧰 ToolBox</a>
<button id="themeToggle" class="theme-button"
type="button" aria-label="Переключить тему">🌙</button>
</div>
</header>

<main class="container">

        <section class="tool-page">

        <p><a href="../index.html">← Все инструменты</a></p>

        <h1>🔎 Поиск и замена</h1>

        <p class="tool-description">
        Замена слов и фрагментов текста.
        </p>

        <div class="tool-box">
        
<textarea id="text"
placeholder="Исходный текст"></textarea>

<label for="find">Найти</label>
<input id="find" placeholder="Что ищем?">

<label for="replace">Заменить на</label>
<input id="replace" placeholder="Новый текст">

<button onclick="toolReplace()">Заменить</button>

<pre id="result" class="result"></pre>

        </div>

        </section>
        
</main>

<footer class="footer">
<div class="container">
© 2026 ToolBox — Бесплатные онлайн-инструменты
</div>
</footer>

</body>
</html>
