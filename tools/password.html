<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор паролей — ToolBox</title>
<meta name="description" content="Создание случайных паролей.">
<link rel="stylesheet" href="../style.css">
<script src="../script.js" defer></script>
</head>
<body>

<header class="header">
<div class="container header-content">
<a href="../index.html" class="logo">🧰 ToolBox</a>
<button id="themeToggle" class="theme-button"
type="button" aria-label="Переключить тему">🌙</button>
</div>
</header>

<main class="container">

        <section class="tool-page">

        <p><a href="../index.html">← Все инструменты</a></p>

        <h1>🔐 Генератор паролей</h1>

        <p class="tool-description">
        Создание случайных паролей.
        </p>

        <div class="tool-box">
        
<label>Длина пароля</label>
<input id="length" type="number" min="8" max="128" value="16">
<button onclick="toolPassword()">Создать пароль</button>
<div id="result" class="result"></div>

        </div>

        </section>
        
</main>

<footer class="footer">
<div class="container">
