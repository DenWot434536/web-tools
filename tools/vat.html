<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Расчёт НДС по выбранной ставке.">
<link rel="stylesheet" href="../style.css">
<script src="../script.js" defer></script>
</head>
<body>

<header class="header">
<div class="container header-content">
<a href="../index.html" class="logo">🧰 ToolBox</a>
<button id="themeToggle" class="theme-button"
type="button" aria-label="Переключить тему">🌙</button>
</div>
</header>

<main class="container">

        <section class="tool-page">

        <p><a href="../index.html">← Все инструменты</a></p>

        <h1>💰 Калькулятор НДС</h1>

        <p class="tool-description">
        Расчёт НДС по выбранной ставке.
        </p>

        <div class="tool-box">
        
<label for="a">Сумма без НДС</label>
<input id="a" type="number" placeholder="1000">

<label for="b">Ставка НДС (%)</label>
<input id="b" type="number" value="22">

<button onclick="toolVAT()">Рассчитать</button>

<div id="result" class="result"></div>

        </div>

        </section>
        
</main>

<footer class="footer">
<div class="container">

</div>
</footer>
